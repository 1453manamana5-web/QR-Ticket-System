    </filter>
</defs>
<style>
svg>g{display:none}svg>g:target,svg>#idle{display:inline}svg>g:target~#idle{display:none}
.trace{opacity:.8;animation:flow 2.6s linear infinite}.trace.b{animation-delay:-1.2s}
#ignition .trace{stroke-dasharray:330 330;animation:draw .82s ease-out both}
#ignition>g{animation:appear .82s ease-out both}
#verified .trace{animation:finish 1.45s ease-out both}
#convergence .trace{animation:finish .52s ease-out both}
@keyframes flow{to{stroke-dashoffset:-342}}
@keyframes draw{from{stroke-dashoffset:330;opacity:1}to{stroke-dashoffset:0;opacity:.15}}
@keyframes appear{from{opacity:.12}to{opacity:1}}
@keyframes finish{0%{opacity:.25}35%{opacity:1;stroke-width:4}100%{opacity:0;stroke-width:1.5}}
@media(prefers-reduced-motion:reduce){svg *{animation:none!important}.trace{display:none}}
</style>
