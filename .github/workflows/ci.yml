name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Firebase client regression tests
        run: npm run test:client

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  browser-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install isolated browser
        run: npx playwright install --with-deps chromium
      - name: Build apps without production credentials
        run: npm run build
      - name: Browser injection and framing attack tests
        run: npm run test:security:browser
