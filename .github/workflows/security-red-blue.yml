name: Isolated security regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  isolated-red-blue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install application and test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Functions test dependencies
        run: npm install --prefix functions --no-audit --no-fund
      - name: Attack fixtures and defensive controls in the demo emulator
        run: npm run test:security
      - name: Normal client flows
        run: npm run test:client
      - name: Normal rules and integration flows
        run: npm run test:rules
      - name: Normal Functions flows
        run: npm run test:callables
      - name: Typecheck and build applications
        run: |
          npm run typecheck
          npm run build
      - name: Typecheck Functions and migration scripts
        run: npm run typecheck --prefix functions
