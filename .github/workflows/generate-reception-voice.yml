name: Generate mature reception audio

on:
  push:
    branches:
      - voice/mature-natural-20261111
      - feature/idle-scan-voice-prompt-20261112
    paths:
      - scripts/generate_reception_voice.py
      - .github/workflows/generate-reception-voice.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.ref == 'refs/heads/voice/mature-natural-20261111' || github.ref == 'refs/heads/feature/idle-scan-voice-prompt-20261112'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech renderer
        run: pip install 'edge-tts>=7.2,<9'
      - name: Install FFmpeg for mixing the original chimes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Render announcement files
        run: |
          if [ "$GITHUB_REF_NAME" = "feature/idle-scan-voice-prompt-20261112" ]; then
            python scripts/generate_reception_voice.py --only-reminder
          else
            python scripts/generate_reception_voice.py
          fi
      - name: Check regenerated audio
        run: |
          for file in reception-app/public/sounds/*voice_d_v1.mp3 reception-app/public/sounds/error_retry_*_d_v1.mp3; do
            test -s "$file"
            ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 "$file" | grep -q 'codec_name=mp3'
          done
      - name: Commit rendered audio to the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reception-app/public/sounds/*.mp3
          if ! git diff --cached --quiet; then
            git commit -m 'audio: render mature natural female reception announcements'
            git push
          fi
